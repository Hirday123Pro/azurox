kind = "web"
previewPath = "/"
title = "Azurox Asset Marketplace"
description = "A premium Roblox asset discovery marketplace where creators browse scripts, UI packs, 3D models, and maps, then order directly through Discord for manual fulfillment. Includes protected admin asset management."
version = "1.0.0"
id = "artifacts/azurox"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21866

[services.development]
run = "pnpm --filter @workspace/azurox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/azurox", "run", "build" ]
serve = "static"
publicDir = "artifacts/azurox/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21866"
BASE_PATH = "/"
